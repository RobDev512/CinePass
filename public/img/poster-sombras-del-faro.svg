<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Cartel de Sombras del Faro: un faro sobre un acantilado, luna llena y mar agitado" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- CinePass · Cartel de Sombras del Faro (Misterio) -->
  <defs>
    <linearGradient id="cielo" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#22344c"/>
      <stop offset=".45" stop-color="#1a2a40"/>
      <stop offset=".75" stop-color="#0f1a2b"/>
      <stop offset="1" stop-color="#070d18"/>
    </linearGradient>
    <radialGradient id="haloLuna" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9f2f8" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#9fb6cc" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9fb6cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luna" cx="0.42" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f4f7f9"/>
      <stop offset=".7" stop-color="#d5dee6"/>
      <stop offset="1" stop-color="#aebccb"/>
    </radialGradient>
    <radialGradient id="luzFaro" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3a8" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ffc56b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e99a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="torre" x1="0" x2="1">
      <stop offset="0" stop-color="#7e8b98"/>
      <stop offset=".45" stop-color="#d9e0e6"/>
      <stop offset="1" stop-color="#5d6976"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#16283c"/>
      <stop offset="1" stop-color="#060c16"/>
    </linearGradient>
    <linearGradient id="sombraTexto" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#050a14" stop-opacity="0"/>
      <stop offset=".35" stop-color="#050a14" stop-opacity=".55"/>
      <stop offset="1" stop-color="#050a14" stop-opacity=".9"/>
    </linearGradient>
    <filter id="difuso" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="difusoSuave"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- Cielo y luna -->
  <rect width="300" height="400" fill="url(#cielo)"/>
  <circle cx="218" cy="62" r="78" fill="url(#haloLuna)"/>
  <circle cx="218" cy="62" r="30" fill="url(#luna)"/>
  <g fill="#b7c4d1" opacity=".35"><circle cx="208" cy="55" r="5"/><circle cx="226" cy="72" r="4"/><circle cx="222" cy="50" r="2.6"/><circle cx="205" cy="73" r="2.4"/></g>

  <!-- Nubes -->
  <g filter="url(#difuso)">
    <ellipse cx="70" cy="40" rx="120" ry="20" fill="#2b3e57" opacity=".8"/>
    <ellipse cx="250" cy="108" rx="110" ry="16" fill="#1c2b40" opacity=".85"/>
    <ellipse cx="40" cy="118" rx="95" ry="18" fill="#22344b" opacity=".75"/>
    <ellipse cx="160" cy="18" rx="80" ry="12" fill="#30445e" opacity=".6"/>
    <ellipse cx="300" cy="35" rx="60" ry="10" fill="#1b2a3e" opacity=".7"/>
  </g>
  <g fill="#e8eef3" opacity=".7">
    <circle cx="30" cy="70" r=".9"/><circle cx="120" cy="58" r=".7"/><circle cx="150" cy="95" r=".8"/><circle cx="272" cy="140" r=".7"/><circle cx="85" cy="90" r=".6"/>
  </g>

  <!-- Resplandor del faro -->
  <circle cx="150" cy="118" r="62" fill="url(#luzFaro)"/>
  <path d="M152 116 L300 92 L300 140 Z" fill="#ffd590" opacity=".08"/>
  <path d="M148 116 L0 96 L0 136 Z" fill="#ffd590" opacity=".06"/>

  <!-- Acantilado -->
  <path d="M0 205 L18 196 L34 199 L52 186 L70 190 L86 178 L104 182 L118 168 L132 165 L172 165 L186 171 L200 166 L216 180 L232 176 L250 190 L268 186 L284 198 L300 194 V400 H0 Z" fill="#0d1522"/>
  <path d="M104 182 L118 168 L132 165 L172 165 L186 171 L200 166 L216 180 L196 188 L176 178 L150 182 L126 180 Z" fill="#1a2433" opacity=".9"/>
  <path d="M0 230 L40 214 L70 222 L110 206 L150 214 L190 204 L232 216 L270 208 L300 218 V400 H0 Z" fill="#0a111c"/>

  <!-- Casa del farero -->
  <path d="M120 166 V152 L130 144 L140 152 V166 Z" fill="#3a4553"/>
  <rect x="124" y="155" width="5" height="5" fill="#f3c06a" opacity=".85"/>
  <path d="M164 166 V156 H182 V166 Z" fill="#2e3846"/>
  <path d="M162 157 L173 149 L184 157 Z" fill="#232c38"/>

  <!-- Torre del faro -->
  <path d="M141 166 L144 126 L156 126 L159 166 Z" fill="url(#torre)"/>
  <g stroke="#5c6875" stroke-width=".8" opacity=".7"><path d="M142.5 150 H157.5M143.4 138 H156.6"/></g>
  <rect x="140.5" y="122" width="19" height="4" rx="1" fill="#2a3340"/>
  <rect x="143" y="110" width="14" height="12" rx="1.2" fill="#ffe9b8"/>
  <rect x="145.5" y="112" width="9" height="8" fill="#fff6dc"/>
  <g stroke="#3b4553" stroke-width="1"><path d="M143 110 V122M157 110 V122M150 110 V122"/></g>
  <path d="M141 110 L150 101 L159 110 Z" fill="#26303c"/>
  <path d="M150 101 V95" stroke="#4d5865" stroke-width="1.2"/>

  <!-- Mar y olas -->
  <path d="M0 255 Q40 245 80 254 T160 252 T240 256 T300 250 V400 H0 Z" fill="url(#mar)"/>
  <g fill="none" stroke="#8fb1cc" stroke-linecap="round" opacity=".35">
    <path d="M10 268 Q30 262 52 268" stroke-width="1.4"/>
    <path d="M190 264 Q215 258 240 265" stroke-width="1.4"/>
    <path d="M90 280 Q120 273 150 281" stroke-width="1.2"/>
    <path d="M232 286 Q260 279 292 287" stroke-width="1.2"/>
  </g>
  <g filter="url(#difusoSuave)" fill="#c9dbe8" opacity=".35">
    <path d="M0 236 Q20 228 42 238 Q60 244 78 236 L80 246 Q40 252 0 248 Z"/>
    <path d="M220 230 Q244 222 270 232 Q288 238 300 232 V244 Q262 250 222 242 Z"/>
  </g>

  <!-- Degradado para el título -->
  <rect y="230" width="300" height="170" fill="url(#sombraTexto)"/>

  <!-- Título -->
  <g text-anchor="middle" fill="#eef3f8" font-family="'Cinzel','Trajan Pro','Times New Roman',Georgia,serif">
    <text x="150" y="292" font-size="31" letter-spacing="3.5">SOMBRAS</text>
    <text x="150" y="311" font-size="11" letter-spacing="3">DEL</text>
    <text x="150" y="344" font-size="35" letter-spacing="3.5">FARO</text>
  </g>
  <g stroke="#c9d3dd" stroke-width="1"><path d="M100 307.5 H130 M170 307.5 H200"/></g>
  <path d="M112 354 H188" stroke="#e5383b" stroke-width="2.2" stroke-linecap="round"/>
  <g text-anchor="middle" fill="#c4cfda" font-family="'Times New Roman',Georgia,serif" font-size="7.4" letter-spacing="1.6">
    <text x="150" y="384">EL MISTERIO TE ESPERA</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
