<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1250" role="img" aria-labelledby="titulo descripcion" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="titulo">CinePass</title>
  <desc id="descripcion">Claqueta cinematográfica sobre un boleto con símbolo de reproducción.</desc>

  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb4f58"/>
      <stop offset="1" stop-color="#f43f50"/>
    </linearGradient>

    <!-- Muescas del contorno azul -->
    <mask id="muescaAzul" maskUnits="userSpaceOnUse" x="0" y="0" width="1250" height="1250">
      <rect width="1250" height="1250" fill="#fff"/>
      <circle cx="178" cy="845" r="72" fill="#000"/>
      <circle cx="1072" cy="845" r="72" fill="#000"/>
    </mask>

    <!-- Muescas del boleto rojo -->
    <mask id="muescaRoja" maskUnits="userSpaceOnUse" x="0" y="0" width="1250" height="1250">
      <rect width="1250" height="1250" fill="#fff"/>
      <circle cx="222" cy="845" r="76" fill="#000"/>
      <circle cx="1027" cy="845" r="78" fill="#000"/>
    </mask>
  </defs>

  <!-- Tapa superior de la claqueta -->
  <path fill="#12213f"
        d="M180 525C180 462 215 420 272 402L930 207C975 195 1012 215 1022 258L1030 300C1034 335 1016 355 990 362L355 515L180 525Z"/>
  <g fill="#c4f5d8">
    <path d="M300 410L425 373L510 455L386 489Z"/>
    <path d="M539 342L662 305L755 391L634 425Z"/>
    <path d="M775 272L897 236L993 327L875 361Z"/>
  </g>

  <!-- Cuerpo de la claqueta + contorno del boleto -->
  <rect x="180" y="510" width="892" height="548" rx="48" fill="#12213f" mask="url(#muescaAzul)"/>

  <circle cx="264" cy="528" r="43" fill="#c4f5d8"/>
  <g fill="#c4f5d8">
    <path d="M412 534H547L471 627H337Z"/>
    <path d="M663 534H797L722 627H587Z"/>
    <path d="M910 534H1045L970 627H834Z"/>
  </g>

  <!-- Boleto -->
  <rect x="222" y="660" width="805" height="350" rx="30" fill="url(#coral)" mask="url(#muescaRoja)"/>

  <!-- Perforaciones y botón de reproducción -->
  <g fill="#c4f5d8">
    <rect x="376" y="698" width="28" height="64" rx="14"/>
    <rect x="376" y="787" width="28" height="64" rx="14"/>
    <rect x="376" y="881" width="28" height="69" rx="14"/>

    <rect x="847" y="698" width="28" height="64" rx="14"/>
    <rect x="847" y="787" width="28" height="64" rx="14"/>
    <rect x="847" y="881" width="28" height="69" rx="14"/>

    <path d="M550 762L708 843L550 932Z" stroke="#c4f5d8" stroke-width="34" stroke-linejoin="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
